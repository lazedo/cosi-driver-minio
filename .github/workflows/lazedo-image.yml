# lazedo fork: build the COSI driver image and publish it to GHCR.
#
# This repo is self-contained (no replace directives), so the build needs only
# its own tree. bind-broker consumes it as a library — pkg/driver with the
# Backend seam — rather than using this image, so the two ship independently.
#
# Each arch builds on a NATIVE runner and the two are joined by digest into one
# manifest: no QEMU. Images carry the short commit SHA; a release additionally
# carries its tag.
name: image

# paths-ignore, e a lista e curta de proposito: o que NAO entra na imagem.
# Sem isto, um commit que so mexe em deploy/migrate-bucket.sh dispara um build
# multi-arch completo para produzir bits identicos -- aconteceu tres vezes
# seguidas num dia. Tudo o resto continua a construir, incluindo o Dockerfile e
# os manifestos que descrevem como a imagem corre: nao vale a pena poupar um
# build a custo de nao saber se o que se publica ainda arranca.
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths-ignore:
      - 'deploy/*.sh'
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: minio-cosi-driver

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=cosi-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=cosi-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/cosi-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-cosi-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-cosi-*
          path: /tmp/digests
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Create multi-arch manifest
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}"
          TAGS="-t ${IMAGE}:${{ steps.sha.outputs.short }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${TAGS} -t ${IMAGE}:${{ github.ref_name }} -t ${IMAGE}:latest"
          elif [ "${{ github.ref_name }}" = "master" ]; then
            TAGS="${TAGS} -t ${IMAGE}:latest"
          fi
          # shellcheck disable=SC2046
          docker buildx imagetools create ${TAGS} \
            $(for f in /tmp/digests/*; do echo "${IMAGE}@$(cat "$f")"; done)
          docker buildx imagetools inspect "${IMAGE}:${{ steps.sha.outputs.short }}"
          echo "\`${IMAGE}:${{ steps.sha.outputs.short }}\` (amd64+arm64)" >> "$GITHUB_STEP_SUMMARY"
